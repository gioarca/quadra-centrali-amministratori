# Sito statico: Netlify esegue la build e pubblica la cartella dist.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Il redirect per l'app a pagina singola sta in public/_redirects: finisce in dist e vale
# anche quando la cartella dist si trascina a mano su Netlify.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
